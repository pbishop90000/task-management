<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #supportTicketModal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .support-ticket-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
        }
        .close-support-modal {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="registrationForm" style="display:none;">
            <h2>Register</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Register</button>
            <p class="form-toggle">Already have an account? <a href="#" id="showLoginLink">Login</a></p>
        </form>

        <form id="loginForm">
            <h2>Login</h2>
            <input type="text" id="loginUsername" placeholder="Username" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Login</button>
            <p class="form-toggle">
                Don't have an account? <a href="#" id="showRegistrationLink">Register</a>
                <br>
                <a href="#" id="supportTicketLink">Need Help? Submit a Support Ticket</a>
            </p>
        </form>

        <!-- Support Ticket Modal -->
        <div id="supportTicketModal">
            <div class="support-ticket-content">
                <span class="close-support-modal">&times;</span>
                <h2>Submit Support Ticket</h2>
                <form id="loginSupportForm">
                    <input type="text" id="supportUsername" placeholder="Your Username" required>
                    <select id="supportIssueType" required>
                        <option value="">Select Issue Type</option>
                        <option value="password_reset">Password Reset</option>
                        <option value="account_reactivation">Account Reactivation</option>
                        <option value="other">Other Technical Issue</option>
                    </select>
                    <textarea id="supportIssueDetails" placeholder="Please provide more details about your issue..." required></textarea>
                    <button type="submit">Submit Support Ticket</button>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
